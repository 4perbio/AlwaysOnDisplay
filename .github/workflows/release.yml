name: Test & release

# Every push to main runs the tests and, if they pass, publishes a new
# version as a GitHub release with an installable zip.
#   - default: patch bump (1.2.3 -> 1.2.4)
#   - "#minor" in any pushed commit message: 1.2.3 -> 1.3.0
#   - "#major" in any pushed commit message: 1.2.3 -> 2.0.0
# The first release uses the "## Version:" from the .toc.
# The same zip is then uploaded to CurseForge when it is configured
# (see "Releases" in README.md).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  release:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Work out the next version
        id: version
        run: |
          set -euo pipefail
          latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          if [ -z "$latest" ]; then
            next=$(sed -n 's/^## Version:[[:space:]]*//p' AlwaysOnDisplay/AlwaysOnDisplay.toc | tr -d '\r')
          else
            IFS=. read -r major minor patch <<< "${latest#v}"
            messages=$(jq -r '[.commits[]?.message] | join("\n")' "$GITHUB_EVENT_PATH")
            if grep -q '#major' <<< "$messages"; then
              major=$((major + 1)); minor=0; patch=0
            elif grep -q '#minor' <<< "$messages"; then
              minor=$((minor + 1)); patch=0
            else
              patch=$((patch + 1))
            fi
            next="$major.$minor.$patch"
          fi
          echo "Latest tag: ${latest:-none} -> next: $next"
          echo "version=$next" >> "$GITHUB_OUTPUT"

      - name: Build the addon zip
        run: |
          set -euo pipefail
          mkdir -p dist
          cp -r AlwaysOnDisplay dist/
          sed -i "s/^## Version:.*/## Version: ${{ steps.version.outputs.version }}/" dist/AlwaysOnDisplay/AlwaysOnDisplay.toc
          (cd dist && zip -r "AlwaysOnDisplay-v${{ steps.version.outputs.version }}.zip" AlwaysOnDisplay)

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            "dist/AlwaysOnDisplay-v${{ steps.version.outputs.version }}.zip" \
            --target "$GITHUB_SHA" \
            --title "AlwaysOnDisplay v${{ steps.version.outputs.version }}" \
            --generate-notes

      # Runs only once the CF_API_KEY secret and CF_PROJECT_ID variable are set.
      - name: Upload to CurseForge
        env:
          GH_TOKEN: ${{ github.token }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          CF_PROJECT_ID: ${{ vars.CF_PROJECT_ID }}
          CF_GAME_VERSION: ${{ vars.CF_GAME_VERSION }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "$CF_API_KEY" ] || [ -z "$CF_PROJECT_ID" ]; then
            echo "::notice::CurseForge upload skipped: set the CF_API_KEY secret and CF_PROJECT_ID variable to enable it."
            exit 0
          fi
          export CHANGELOG="$(gh release view "v$VERSION" --json body -q .body)"
          bash .github/scripts/curseforge-upload.sh "dist/AlwaysOnDisplay-v$VERSION.zip" "$VERSION"

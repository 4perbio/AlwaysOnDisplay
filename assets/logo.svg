<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232a3b"/>
      <stop offset="1" stop-color="#0d1018"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6d77a"/>
      <stop offset="0.5" stop-color="#c9952f"/>
      <stop offset="1" stop-color="#8a5a12"/>
    </linearGradient>
    <linearGradient id="hp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fe36b"/>
      <stop offset="1" stop-color="#1c8f2c"/>
    </linearGradient>
    <linearGradient id="mp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5aa8ff"/>
      <stop offset="1" stop-color="#1747b8"/>
    </linearGradient>
    <linearGradient id="track" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05070b"/>
      <stop offset="1" stop-color="#1a1f2b"/>
    </linearGradient>
    <radialGradient id="iris" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset="0.45" stop-color="#f2c14e"/>
      <stop offset="1" stop-color="#a86a10"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- frame -->
  <rect x="16" y="16" width="480" height="480" rx="84" fill="url(#gold)"/>
  <rect x="32" y="32" width="448" height="448" rx="70" fill="url(#bg)"/>

  <!-- always-open eye -->
  <path d="M96 176 Q256 40 416 176 Q256 312 96 176 Z" fill="#0a0d14" stroke="url(#gold)" stroke-width="16" stroke-linejoin="round"/>
  <circle cx="256" cy="176" r="62" fill="url(#iris)"/>
  <circle cx="256" cy="176" r="26" fill="#0a0d14"/>
  <circle cx="276" cy="156" r="11" fill="#fff" opacity="0.9"/>

  <!-- health bar -->
  <rect x="72" y="292" width="368" height="64" rx="14" fill="url(#track)" stroke="url(#gold)" stroke-width="8"/>
  <rect x="80" y="300" width="268" height="48" rx="8" fill="url(#hp)"/>
  <rect x="80" y="300" width="268" height="22" rx="8" fill="url(#shine)"/>

  <!-- resource bar -->
  <rect x="72" y="380" width="368" height="64" rx="14" fill="url(#track)" stroke="url(#gold)" stroke-width="8"/>
  <rect x="80" y="388" width="196" height="48" rx="8" fill="url(#mp)"/>
  <rect x="80" y="388" width="196" height="22" rx="8" fill="url(#shine)"/>

  <!-- the always-visible values -->
  <g font-family="Arial Black, Segoe UI Black, Arial, sans-serif" font-weight="900" font-size="38"
     text-anchor="middle" fill="#fff" stroke="#000" stroke-width="7" paint-order="stroke" stroke-linejoin="round">
    <text x="256" y="338">730 / 1000</text>
    <text x="256" y="426">52%</text>
  </g>
</svg>
